query CloudAgentThreadsInEnvironment($environmentId: ID!, $mine: Boolean, $archived: Boolean) {
  cloudAgents(environmentId: $environmentId, mine: $mine, archived: $archived) {
    id
    name
    status
    projectId
    environmentId
    createdAt
    archivedAt
    workStatus {
      state
      kind
      message
      unseen
      at
    }
    sessions {
      sessionId
      sessionName
      harness
      state
      title
      prompt
      latestPrompt
      updatedAt
      taskId
      workStatus {
        state
        kind
        message
        unseen
        at
      }
    }
  }
}
