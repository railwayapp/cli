query Verifiers(
  $projectId: String!
  $revisionId: String
  $status: VerifierStatus
) {
  verifiers(
    projectId: $projectId
    revisionId: $revisionId
    status: $status
  ) {
    id
    name
    intent
    kind
    status
    projectId
    environmentId
    workloadKind
    workloadId
    revisionId
    clonedFromId
    holdSeconds
    heldSeconds
    deadline
    createdAt
    resolvedAt
  }
}
