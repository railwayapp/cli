mutation VolumeInstanceBackupRestore(
  $volumeInstanceId: String!
  $volumeInstanceBackupId: String!
  $replicaServiceIds: [String!]
  $wipeServiceIds: [String!]
) {
  volumeInstanceBackupRestore(
    volumeInstanceId: $volumeInstanceId
    volumeInstanceBackupId: $volumeInstanceBackupId
    replicaServiceIds: $replicaServiceIds
    wipeServiceIds: $wipeServiceIds
  ) {
    workflowId
  }
}
