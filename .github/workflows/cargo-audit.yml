name: Cargo audit

on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  schedule:
    - cron: "0 0 * * *"

jobs:
  security_audit:
    runs-on: ubuntu-latest
    # audit-check reports through a check run and opens issues for advisories;
    # the repo's default GITHUB_TOKEN is read-only, so ask for exactly those.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: checkout
        uses: actions/checkout@v3.3.0

      - name: cargo audit
        uses: actions-rs/audit-check@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
